services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: dfsha-etcd-1
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://172.31.21.156:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://172.31.21.156:2380
      - --initial-cluster=etcd-1=http://172.31.21.156:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=dfsha-etcd-cluster
    volumes:
      - ./etcd-data:/etcd-data
    ports:
      - "2379:2379"
      - "2380:2380"
